name: Apply pending weekly patches
on:
  push:
    branches: [main]
    paths:
      - 'pending-patches/**'
      - '.github/workflows/weekly-apply.yml'
  schedule:
    - cron: '0 23 * * 0'   # Sundays 23:00 UTC = Mondays 07:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply pending patches
        run: |
          shopt -s nullglob
          patches=(pending-patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "No pending patches. Nothing to do."
            exit 0
          fi
          for p in "${patches[@]}"; do
            echo "Checking $p"
            git apply --check "$p" || { echo "::error::$p does not apply cleanly"; exit 1; }
          done
          for p in "${patches[@]}"; do
            echo "Applying $p"
            git apply "$p"
            git rm -f "$p"
          done
          git add -A

      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          import re
          html = open('index.html', encoding='utf-8').read()
          blocks = re.findall(r'<script>(.*?)</script>', html, re.S)
          if not blocks:
              raise SystemExit('No inline script found in index.html')
          open('/tmp/inline.js', 'w', encoding='utf-8').write(max(blocks, key=len))
          PY
          node --check /tmp/inline.js
          echo "Inline JS syntax OK."

      - name: Commit applied patches
        run: |
          git config user.name "s230127-lab"
          git config user.email "s230127@ktmc.edu.hk"
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Apply weekly patches $(date +%F)"
          git push origin main
          echo "Weekly patches applied and pushed."
