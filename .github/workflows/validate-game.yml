name: Validate game JavaScript

on:
  push:
    paths:
      - "index.html"
      - ".github/workflows/validate-game.yml"
  pull_request:
    paths:
      - "index.html"
      - ".github/workflows/validate-game.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the inline game script syntax
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script([^>]*)>(.*?)</script>", html, flags=re.I | re.S)
          inline = [body for attrs, body in scripts if "src=" not in attrs.lower() and body.strip()]
          if len(inline) != 1:
              raise SystemExit(f"Expected exactly one inline game script, found {len(inline)}")
          Path("/tmp/weiqi-inline.js").write_text(inline[0], encoding="utf-8")
          print("Extracted the inline game script.")
          PY
          node --check /tmp/weiqi-inline.js
