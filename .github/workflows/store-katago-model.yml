name: Add KataGo model to this repository

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/store-katago-model.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-model:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and assemble the KataGo model
        shell: bash
        run: |
          set -euo pipefail

          MODEL_DIR="models"
          MODEL_FILE="$MODEL_DIR/katago.onnx"
          mkdir -p "$MODEL_DIR"

          if [[ -s "$MODEL_FILE" ]]; then
            SIZE="$(stat -c%s "$MODEL_FILE")"
            if [[ "$SIZE" -gt 50000000 && "$SIZE" -lt 100000000 ]]; then
              echo "A valid-sized model already exists: $SIZE bytes"
              exit 0
            fi
          fi

          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          for i in $(seq 0 17); do
            PART="$(printf '%02d' "$i")"
            URL="https://raw.githubusercontent.com/liumingmusic/weiqi/master/katago/model-parts/part_${PART}.js"
            echo "Fetching model part ${PART}/17..."
            curl --fail --location --retry 4 --retry-delay 2 \
              "$URL" --output "$TMP/part_${PART}.js"
            test -s "$TMP/part_${PART}.js"
          done

          cat "$TMP"/part_*.js | tr -d '\r\n ' | base64 --decode > "$MODEL_FILE"

          SIZE="$(stat -c%s "$MODEL_FILE")"
          echo "Assembled model size: $SIZE bytes"
          if [[ "$SIZE" -lt 50000000 || "$SIZE" -ge 100000000 ]]; then
            echo "::error::Unexpected model size; refusing to commit it."
            rm -f "$MODEL_FILE"
            exit 1
          fi

          # Basic sanity check: make sure this is binary data, not a web error page.
          if head -c 64 "$MODEL_FILE" | grep -aEiq '<!doctype|<html|version https://git-lfs'; then
            echo "::error::The downloaded data is not an ONNX model."
            rm -f "$MODEL_FILE"
            exit 1
          fi

      - name: Commit the model into this repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/katago.onnx
          if git diff --cached --quiet; then
            echo "No model changes to commit."
            exit 0
          fi
          git commit -m "Add self-hosted KataGo ONNX model [skip ci]"
          git push
