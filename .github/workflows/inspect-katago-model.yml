name: Inspect KataGo ConvInteger zero point

on:
  push:
    paths:
      - ".github/workflows/inspect-katago-model.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the quantized weight zero point
        shell: bash
        run: |
          python -m pip install --quiet onnx numpy
          python - <<'PY'
          import onnx
          from onnx import numpy_helper

          model = onnx.load_model("models/katago.onnx", load_external_data=False)
          tensor = model.graph.initializer[626]
          consumers = [n for n in model.graph.node if tensor.name in n.input]
          initializers = {item.name: item for item in model.graph.initializer}
          print(f"CONSUMER_COUNT={len(consumers)}")
          for node in consumers:
              print(f"CONSUMER_OP={node.op_type}")
              print(f"CONSUMER_INPUT_COUNT={len(node.input)}")
              for index, name in enumerate(node.input):
                  print(f"INPUT_{index}_NAME={name}")
                  if name in initializers:
                      parameter = initializers[name]
                      values = numpy_helper.to_array(parameter).reshape(-1)
                      print(f"INPUT_{index}_TYPE={onnx.TensorProto.DataType.Name(parameter.data_type)}")
                      print(f"INPUT_{index}_SHAPE={list(parameter.dims)}")
                      print(f"INPUT_{index}_VALUE_COUNT={len(values)}")
                      if len(values) <= 4:
                          print(f"INPUT_{index}_VALUES={[int(v) for v in values]}")
              if node.op_type == "ConvInteger" and len(node.input) > 3:
                  zp_name = node.input[3]
                  if zp_name in initializers:
                      zp = numpy_helper.to_array(initializers[zp_name]).reshape(-1)
                      print(f"WEIGHT_ZERO_POINT_TENSOR={zp_name}")
                      print(f"WEIGHT_ZERO_POINT_VALUES={[int(v) for v in zp[:4]]}")
          PY
