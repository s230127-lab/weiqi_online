name: Inspect KataGo quantized tensor links

on:
  push:
    paths:
      - ".github/workflows/inspect-katago-model.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect tensor consumers and quantization annotations
        shell: bash
        run: |
          python -m pip install --quiet onnx
          python - <<'PY'
          import onnx

          model = onnx.load_model("models/katago.onnx", load_external_data=False)
          tensor = model.graph.initializer[626]
          print(f"TENSOR={tensor.name}")
          consumers = [node for node in model.graph.node if tensor.name in node.input]
          print(f"CONSUMER_COUNT={len(consumers)}")
          for node in consumers:
              positions = [i for i, name in enumerate(node.input) if name == tensor.name]
              print(f"CONSUMER_OP={node.op_type} INPUT_POSITIONS={positions} NODE={node.name}")

          annotations = [
              item for item in model.graph.quantization_annotation
              if item.tensor_name == tensor.name
          ]
          print(f"QUANTIZATION_ANNOTATION_COUNT={len(annotations)}")
          for annotation in annotations:
              for entry in annotation.quant_parameter_tensor_names:
                  print(f"QUANT_PARAM_KEY={entry.key} TENSOR={entry.value}")

          print(f"OTHER_INITIALIZERS_WITH_SIMILAR_NAME={sum(1 for item in model.graph.initializer if 'weight_quantized' in item.name and item.name != tensor.name)}")
          PY
