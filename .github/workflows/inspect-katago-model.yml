name: Inspect KataGo model metadata safely

on:
  push:
    paths:
      - ".github/workflows/inspect-katago-model.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate the masked alert prefix without revealing the token
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          data = Path("models/katago.onnx").read_bytes()
          needle = b"hf_gpele"
          offsets = []
          start = 0
          while True:
              pos = data.find(needle, start)
              if pos < 0:
                  break
              offsets.append(pos)
              start = pos + 1
          print(f"MODEL_SIZE_BYTES={len(data)}")
          print(f"ALERT_PREFIX_COUNT={len(offsets)}")
          print(f"CR_BYTES={data.count(bytes([13]))}")
          print(f"LF_BYTES={data.count(bytes([10]))}")
          for pos in offsets:
              end = pos + len(needle)
              while end < len(data) and (
                  48 <= data[end] <= 57 or 65 <= data[end] <= 90 or 97 <= data[end] <= 122
              ):
                  end += 1
              print(f"ALERT_PREFIX_OFFSET={pos} ALNUM_RUN_AFTER_HF_PREFIX={end-pos-3}")
          PY
