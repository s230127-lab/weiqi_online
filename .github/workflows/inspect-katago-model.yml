name: Inspect KataGo ONNX tensor

on:
  push:
    paths:
      - ".github/workflows/inspect-katago-model.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect the affected tensor without printing the secret
        shell: bash
        run: |
          python -m pip install --quiet onnx
          python - <<'PY'
          from pathlib import Path
          import onnx

          model_path = Path("models/katago.onnx")
          model = onnx.load_model(str(model_path), load_external_data=False)
          tensor = model.graph.initializer[626]
          raw = tensor.raw_data
          needle = b"hf_gpele"
          offset = raw.find(needle)
          end = offset + len(needle)
          while end < len(raw) and (
              48 <= raw[end] <= 57 or 65 <= raw[end] <= 90 or 97 <= raw[end] <= 122
          ):
              end += 1
          print("ONNX_PARSE=OK")
          print(f"TENSOR_NAME={tensor.name}")
          print(f"TENSOR_DATA_TYPE={onnx.TensorProto.DataType.Name(tensor.data_type)}")
          print(f"TENSOR_DIMS={list(tensor.dims)}")
          print(f"RAW_DATA_BYTES={len(raw)}")
          print(f"MATCH_OFFSET_IN_TENSOR={offset}")
          print(f"MATCH_LENGTH={end-offset}")
          print(f"MATCH_ALIGNED_TO_ELEMENT_4={(offset % 4)==0}")
          print(f"MATCH_ALIGNED_TO_ELEMENT_2={(offset % 2)==0}")
          PY
