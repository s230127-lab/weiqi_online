name: Inspect KataGo ONNX field

on:
  push:
    paths:
      - ".github/workflows/inspect-katago-model.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Identify the ONNX field holding the alert value
        shell: bash
        run: |
          python -m pip install --quiet onnx
          python - <<'PY'
          from pathlib import Path
          from google.protobuf.descriptor import FieldDescriptor
          import onnx

          path = Path("models/katago.onnx")
          raw = path.read_bytes()
          needle = b"hf_gpele"
          print(f"MODEL_SIZE_BYTES={len(raw)}")
          print(f"ALERT_PREFIX_RAW_COUNT={raw.count(needle)}")
          model = onnx.load_model(str(path), load_external_data=False)
          print("ONNX_PARSE=OK")

          found = []
          def walk(message, field_path):
              for field, value in message.ListFields():
                  values = value if field.is_repeated else [value]
                  for index, item in enumerate(values):
                      item_path = f"{field_path}.{field.name}"
                      if field.is_repeated:
                          item_path += f"[{index}]"
                      if field.type == FieldDescriptor.TYPE_MESSAGE:
                          walk(item, item_path)
                      elif field.type in (FieldDescriptor.TYPE_STRING, FieldDescriptor.TYPE_BYTES):
                          blob = item if isinstance(item, bytes) else item.encode("utf-8")
                          if needle in blob:
                              found.append((item_path, field.type, len(blob), blob.count(needle)))

          walk(model, "ModelProto")
          print(f"PROTOBUF_FIELD_MATCH_COUNT={len(found)}")
          for field_path, field_type, field_length, count in found:
              kind = "BYTES" if field_type == FieldDescriptor.TYPE_BYTES else "STRING"
              print(f"FIELD={field_path} TYPE={kind} VALUE_BYTES={field_length} MATCHES={count}")
          PY
