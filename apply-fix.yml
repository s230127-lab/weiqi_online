      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY_EOF'
          import re
          html = open('index.html', encoding='utf-8').read()
          blocks = re.findall(r'<script>(.*?)</script>', html, re.S)
          if not blocks:
              raise SystemExit('No inline script found in index.html')
          open('/tmp/inline.js', 'w', encoding='utf-8').write(max(blocks, key=len))
          PY_EOF
          node --check /tmp/inline.js
          echo "Inline JS syntax OK."

      - name: Commit fix and remove this workflow
        run: |
          git config user.name "s230127-lab"
          git config user.email "s230127@ktmc.edu.hk"
          git add index.html
          git rm -f .github/workflows/apply-fix.yml
          git commit -m "Fix duplicate i18n keys, dead code, and stale end-screen text on language switch"
          git push origin main
          echo "Fix pushed to main."

      - name: Failure notice
        if: failure()
        run: |
          echo "Validation or patch application failed; nothing was pushed."
          git diff --stat || true
